# outbox 中继在测试里跑得很密:多条跨域链路已改走 outbox,中继不跑下游就永远收不到事件,
# 几乎所有 await() 都会超时。
# 需要断言"事件尚未投递"的用例(SettlementOutboxReliabilityTest)用
# @SpringBootTest(properties=...) 把它覆盖成极大值再显式驱动中继——
# 所以这个默认值必须放在优先级最低的地方,不能放 @DynamicPropertySource。
xbb.outbox.relay.interval-ms=200

# 测试里不退避:绝大多数用例关心的是"失败了还能重试",不是"等多久再重试"。
# 退避本身由 OutboxBackoffTest(纯函数)和 OutboxRetryPolicyTest(设了非零退避)覆盖。
xbb.outbox.retry.base-ms=0
